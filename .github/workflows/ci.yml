name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dev-shell
      - name: Check formatting
        run: nix develop -c knave fmt --check
      - name: Run tests
        run: nix develop -c knave test
