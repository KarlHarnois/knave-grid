name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dev-shell
      - name: Fetch libraries so the formatter can read their shapes
        run: nix develop -c knave check tasks/demo.knv
      - name: Check formatting
        run: nix develop -c knave fmt --check
      - name: Check that no .knv file is longer than 150 lines
        run: nix develop -c knave task check-file-lengths
      - name: Run tests
        run: nix develop -c knave test
